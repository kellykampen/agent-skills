name: PR standard
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to revalidate
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: pr-standard-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Validate PR metadata
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      # Only trusted base code runs with write permissions. Never check out the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/enforce-pr-standard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
