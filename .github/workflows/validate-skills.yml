name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: python3 scripts/validate_skills.py
      - name: Test social-capture scripts without network access
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR metadata and lifecycle tests
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: |
          node --test --test-concurrency=1 scripts/pr-standard.test.mjs scripts/enforce-pr-standard.test.mjs
          python3 -m unittest discover -s scripts/worktree -p 'test_*.py' -v
      - name: Validate actual PR metadata and negative control (read-only)
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { validatePullRequest } from './scripts/pr-standard.mjs';
          const { pull_request: pr } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          assert.deepEqual(validatePullRequest(pr), []);
          assert.ok(validatePullRequest({ ...pr, title: 'invalid metadata' }).length);
          console.log('Actual PR metadata accepted; invalid title rejected. No write token used.');
          JS

  repository-quality-gates:
    name: Repository quality gates
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require completed validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != success ]; then
            echo "Required validation did not succeed: $VALIDATION_RESULT"
            exit 1
          fi
          echo "All repository validation checks succeeded."
